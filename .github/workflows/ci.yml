name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck iproute2 openssh-client
      - name: Run tests as CI user
        run: ./tests/test.sh
      - name: Run tests as root
        run: sudo --preserve-env=PATH ./tests/test.sh
